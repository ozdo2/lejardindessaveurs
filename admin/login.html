<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Connexion — Administration</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@300;400;500&display=swap');

        :root {
            --primary: #2c5f2d;
            --accent:  #d4af37;
            --error:   #c0392b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Jost', sans-serif;
            font-weight: 300;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a2e1a 0%, #2c5f2d 50%, #1a2e1a 100%);
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        .login-card {
            background: white;
            border-radius: 16px;
            padding: 3rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
            position: relative;
            z-index: 1;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .login-logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            color: var(--primary);
            font-weight: 600;
            display: block;
            margin-bottom: 0.25rem;
        }

        .login-header p {
            font-size: 0.85rem;
            color: #888;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .divider {
            width: 40px;
            height: 2px;
            background: var(--accent);
            margin: 1rem auto;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 2px solid #e8e8e8;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: 'Jost', sans-serif;
            transition: border-color 0.2s;
            outline: none;
            color: #333;
        }

        .form-group input:focus {
            border-color: var(--primary);
        }

        .btn-login {
            width: 100%;
            padding: 0.9rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-family: 'Jost', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
            letter-spacing: 0.5px;
        }

        .btn-login:hover { background: #3a7a3b; transform: translateY(-1px); }
        .btn-login:disabled { background: #aaa; cursor: not-allowed; transform: none; }

        .error-msg {
            display: none;
            background: #fdf0ef;
            border-left: 3px solid var(--error);
            color: var(--error);
            padding: 0.75rem 1rem;
            border-radius: 0 6px 6px 0;
            font-size: 0.88rem;
            margin-top: 1rem;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.83rem;
            color: #aaa;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover { color: var(--primary); }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <span class="login-logo">Le Jardin des Saveurs</span>
        <div class="divider"></div>
        <p>Espace Administration</p>
    </div>

    <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="admin@restaurant.fr" autocomplete="email">
    </div>

    <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="btn-login" id="btn-login">Se connecter</button>

    <div class="error-msg" id="error-msg"></div>

    <a href="/" class="back-link">← Retour au site</a>
</div>

<script type="module">
    import { auth } from '../firebase.js';
    import { signInWithEmailAndPassword, onAuthStateChanged }
        from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

    // Si déjà connecté → rediriger direct vers dashboard
    onAuthStateChanged(auth, user => {
        if (user) window.location.href = '/admin/dashboard';
    });

    const btnLogin  = document.getElementById('btn-login');
    const emailEl   = document.getElementById('email');
    const passEl    = document.getElementById('password');
    const errorEl   = document.getElementById('error-msg');

    // Login au clic ou Enter
    [emailEl, passEl].forEach(el => {
        el.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    });
    btnLogin.addEventListener('click', doLogin);

    async function doLogin() {
        const email    = emailEl.value.trim();
        const password = passEl.value;

        if (!email || !password) {
            showError('Veuillez remplir tous les champs.');
            return;
        }

        btnLogin.disabled = true;
        btnLogin.innerHTML = '<span class="spinner"></span>Connexion…';
        errorEl.style.display = 'none';

        try {
            await signInWithEmailAndPassword(auth, email, password);
            window.location.href = '/admin/dashboard';
        } catch (err) {
            const messages = {
                'auth/invalid-credential':   'Email ou mot de passe incorrect.',
                'auth/user-not-found':        'Aucun compte trouvé avec cet email.',
                'auth/wrong-password':        'Mot de passe incorrect.',
                'auth/too-many-requests':     'Trop de tentatives. Réessayez dans quelques minutes.',
                'auth/invalid-email':         'Adresse email invalide.',
            };
            showError(messages[err.code] || 'Erreur de connexion. Réessayez.');
            btnLogin.disabled = false;
            btnLogin.textContent = 'Se connecter';
        }
    }

    function showError(msg) {
        errorEl.textContent   = msg;
        errorEl.style.display = 'block';
    }
</script>

</body>
</html>
